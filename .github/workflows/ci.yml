name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: List files (debug)
        run: ls -la
      
      - name: Check Python version
        run: python --version
      
      - name: Check if files exist
        run: |
          echo "Checking files..."
          test -f README.md && echo "✓ README.md exists"
          test -f trading_env.py && echo "✓ trading_env.py exists"
          test -f train.py && echo "✓ train.py exists"
          test -f requirements.txt && echo "✓ requirements.txt exists"
          test -f .gitignore && echo "✓ .gitignore exists"
          test -d src && echo "✓ src directory exists"
          test -f src/agent.py && echo "✓ src/agent.py exists"
      
      - name: Simple Python import test
        run: |
          python -c "print('Python is working!')"
          python -c "import sys; print(f'Python version: {sys.version}')"
